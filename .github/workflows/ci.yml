name: CI

on:
  push:
    branches: [game-v2, main, new-web]
  pull_request:
    branches: [game-v2, main, new-web]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check for client directory
        id: check-client
        run: |
          if [ -d "client" ] && [ -f "client/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Install frontend dependencies
        if: steps.check-client.outputs.exists == 'true'
        working-directory: client
        run: npm ci
      - name: Build frontend
        if: steps.check-client.outputs.exists == 'true'
        working-directory: client
        run: npm run build
      - name: Skip frontend (no client dir)
        if: steps.check-client.outputs.exists != 'true'
        run: echo "No client directory found, skipping frontend build"
